# ============================================
# setup-structure.yml — 四倉架構 + 動態共享包（穩健版）
# 位置：AI-General/.github/workflows/setup-structure.yml
# ============================================

name: Build Shared Packages and Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
  repository_dispatch:
    types: [web-app-family-updated, ai-training-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout AI-General
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 步驟 1：從 PROJECT-LIST.md 自動生成 REPOS.md
      - name: Generate REPOS.md from PROJECT-LIST.md
        run: |
          if [ ! -f "docs/records/PROJECT-LIST.md" ]; then
            echo "找不到 PROJECT-LIST.md，跳過"
            exit 0
          fi
          OUTPUT="docs/records/REPOS.md"
          echo "# 倉庫清單" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> ⚠️ 本檔由 GitHub Actions 從 PROJECT-LIST.md 自動生成，請勿手動編輯。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "最後更新：$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          awk '
            /^## 專案/ { block=1; next }
            block && /^name:/ { name=$2 }
            block && /^repo:/ { repo=$2 }
            block && /^package:/ { pkg=$2 }
            block && /^---/ {
              if (name && repo && pkg) {
                print "## " name
                print ""
                print "name: " name
                print "path: external/" name
                print "repo: " repo
                print "package: " pkg
                print ""
                print "---"
                print ""
              }
              name=""; repo=""; pkg=""; block=0
            }
          ' docs/records/PROJECT-LIST.md >> "$OUTPUT"

      # 步驟 2：Checkout 所有專案倉庫（到 external/）
      - name: Checkout all project repos
        run: |
          if [ ! -f "docs/records/REPOS.md" ]; then
            echo "找不到 REPOS.md，跳過"
            exit 0
          fi
          awk '
            /^## / { block=1; next }
            block && /^name:/ { name=$2 }
            block && /^path:/ { path=$2 }
            block && /^repo:/ { repo=$2 }
            block && /^---/ {
              if (name && path && repo) print name "|" path "|" repo
              name=""; path=""; repo=""; block=0
            }
          ' docs/records/REPOS.md > /tmp/repos.txt
          while IFS='|' read -r name path repo; do
            if [ -n "$repo" ]; then
              echo "Checkout: $repo -> $path"
              git clone --depth 1 "https://x-access-token:${{ secrets.CROSS_REPO_PAT }}@github.com/$repo.git" "$path" 2>/dev/null || echo "  (clone 失敗，跳過)"
            fi
          done < /tmp/repos.txt

      - name: Checkout AI-training-build
        uses: actions/checkout@v4
        with:
          repository: tlee20860-dotcom/AI-training-build
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: build-repo

      # 步驟 3：生成 PACKAGE-CORE.md
      - name: Build PACKAGE-CORE.md
        run: |
          OUTPUT="build-repo/PACKAGE-CORE.md"
          echo "# AI 協作 - 通用規則包" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> 生成時間：$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          if [ -f "docs/common/C-11-terms.md" ]; then
            echo "## 📖 共同語言表（C-11）" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "**【語言規則】你必須嚴格使用「繁體中文」回覆，禁止使用簡體中文。若你輸出簡體中文，視為任務失敗。**" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "**【交付前確認】任何檔案內容、修改方案、R-01 更新，都必須先向我報告「打算做什麼」，等我說「確認」之後，才能輸出完整內容。**" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "**【所屬專案】每次回覆請在開頭標示「所屬專案：{專案名稱}」。通用檔案標「AI 對話系統」，專案檔案標對應專案。**" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            cat "docs/common/C-11-terms.md" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "---" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
          fi

          echo "## 🚨 AI 啟動指示（最高優先）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 0：讀取規則並回報" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "請先讀取本檔案中的以下檔案：C-00、C-01、C-02、C-04、R-01、PROJECT-LIST。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "讀完後，請回報以下三件事：" >> "$OUTPUT"
          echo "1. 「已讀取核心規則」" >> "$OUTPUT"
          echo "2. 用 3~5 條列點，摘要 C-01 中「使用者的核心偏好」" >> "$OUTPUT"
          echo "3. 用 3~5 條列點，摘要 C-02 中「你必須遵守的關鍵規則」" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "回報完畢後停下來，等待我回覆「確認」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 1：自報編號" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我說「確認」後，從 R-01 §四計算新編號，輸出「🆔 A{YYYYMMDD}-{序號3位}」，停下來等我回覆「繼續」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 2：R-01 更新確認" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我說「繼續」後，報告準備更新 R-01，等我確認後吐出完整 R-01 內容，我貼上後回覆「已更新」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 3：列出專案清單" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "從 PROJECT-LIST.md 列出所有專案，詢問我要進行哪個。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 4：請求對應的專案包" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "依我選擇的專案，說「請上傳 {對應的 package 檔名} 以繼續」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 5：自主提取與方案確認" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "收到專案包後，當我提出需求，自動分析、報告方案、等我確認後才輸出完整內容。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 新增專案流程" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "當我說「新增專案」，請一次列出 Q1~Q6（含人話說明），等我逐一回答。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "Q1：專案英文名稱（A. 自訂 / B. AI 自動生成）" >> "$OUTPUT"
          echo "Q2：專案顯示名稱（A. 自訂 / B. AI 自動生成）" >> "$OUTPUT"
          echo "Q3：專案領域（A. W / B. V / C. D / D. M / E. 其他）" >> "$OUTPUT"
          echo "Q4：倉庫可見性（A. Public / B. Private）" >> "$OUTPUT"
          echo "Q5：是否自動建立倉庫（A. 是 / B. 否）" >> "$OUTPUT"
          echo "Q6：新倉庫初始內容（A. 只有 README / B. README + .gitignore / C. README + .gitignore + 目錄）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我回答後，報告準備新增的專案，等我確認後吐出完整 PROJECT-LIST.md。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## ⛔ 禁止事項（違反視為任務失敗）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "1. 禁止使用簡體中文回覆。" >> "$OUTPUT"
          echo "2. 禁止在未經我確認前，直接輸出任何檔案內容或修改方案。" >> "$OUTPUT"
          echo "3. 禁止跳過步驟 0，直接進入步驟 1。" >> "$OUTPUT"
          echo "4. 禁止在步驟 3 之前，自行判斷或假設專案。" >> "$OUTPUT"
          echo "5. 禁止一次輸出超過 2000 字的方案，請分段並等待我確認。" >> "$OUTPUT"
          echo "6. 禁止未標示「所屬專案」。" >> "$OUTPUT"
          echo "7. 禁止以 Token 為理由，交付不完整的檔案。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 📚 核心訓練規則" >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          # 用穩健函數輸出每個檔案
          for f in \
            docs/common/C-00-startup.md \
            docs/common/C-01-profile.md \
            docs/common/C-02-rules.md \
            docs/common/C-04-delivery.md \
            docs/records/R-01-writers.md
          do
            if [ -f "$f" ]; then
              bash .github/workflows/append_file.sh "$f" "$OUTPUT"
            fi
          done

          # 附加 PROJECT-LIST.md
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 📋 專案清單（PROJECT-LIST.md）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          if [ -f "docs/records/PROJECT-LIST.md" ]; then
            bash .github/workflows/append_file.sh "docs/records/PROJECT-LIST.md" "$OUTPUT"
          fi

      # 步驟 4：生成 PACKAGE-SKILLS-W.md
      - name: Build PACKAGE-SKILLS-W.md
        run: |
          OUTPUT="build-repo/PACKAGE-SKILLS-W.md"
          echo "# Web App 技能包（W-*）" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> 生成時間：$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          for f in docs/skills/W/*.md; do
            if [ -f "$f" ]; then
              bash .github/workflows/append_file.sh "$f" "$OUTPUT"
            fi
          done

      # 步驟 5：動態生成所有專案包
      - name: Build all project packages dynamically
        run: |
          if [ ! -f "docs/records/REPOS.md" ]; then
            echo "沒有 REPOS.md，跳過"
            exit 0
          fi

          awk '
            /^## / { block=1; next }
            block && /^name:/ { name=$2 }
            block && /^path:/ { path=$2 }
            block && /^package:/ { pkg=$2 }
            block && /^---/ {
              if (name && path && pkg) print name "|" path "|" pkg
              name=""; path=""; pkg=""; block=0
            }
          ' docs/records/REPOS.md > /tmp/projects.txt

          while IFS='|' read -r name path pkg; do
            [ -z "$name" ] && continue
            OUTPUT="build-repo/PACKAGE-${pkg}.md"

            echo "# 專案包：${name}" > "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "> 生成時間：$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "## 📌 使用方式" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "本檔案為「${name}」專案的完整上下文包。" >> "$OUTPUT"
            echo "AI 已讀取通用規則包（PACKAGE-CORE.md），本包包含專案文件與程式碼。" >> "$OUTPUT"
            echo "" >> "$OUTPUT"

            # 加入專案文件
            proj_docs_dir="$path/docs/projects/${name}"
            if [ -d "$proj_docs_dir" ]; then
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "# 📁 專案文件" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              for f in ${proj_docs_dir}/*.md; do
                if [ -f "$f" ]; then
                  bash .github/workflows/append_file.sh "$f" "$OUTPUT"
                fi
              done
            fi

            # 加入程式碼
            if [ -d "$path" ]; then
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "# 💻 專案程式碼" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              cd "$path"
              find . -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) \
                -not -path "./.git/*" \
                -not -path "./node_modules/*" \
                -not -path "./.github/*" \
                -not -path "./docs/*" \
                | sort > /tmp/code_files.txt
              while read -r file; do
                clean_path="${file#./}"
                bash "../../.github/workflows/append_file.sh" "$file" "../../$OUTPUT"
              done < /tmp/code_files.txt
              cd ../..
            fi

            echo "" >> "$OUTPUT"
            echo "/* ═══ EOF ═══ */" >> "$OUTPUT"
          done < /tmp/projects.txt

      # 步驟 6：複製 PROJECT-LIST 到 build-repo
      - name: Copy PROJECT-LIST to build-repo
        run: |
          [ -f "docs/records/PROJECT-LIST.md" ] && cp "docs/records/PROJECT-LIST.md" "build-repo/PROJECT-LIST.md"

      # 步驟 7：部署到 AI-training-build
      - name: Deploy to AI-training-build
        run: |
          cd build-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "無變化，跳過"
            exit 0
          fi
          git commit -m "chore: auto-build packages [skip ci]"
          git push

