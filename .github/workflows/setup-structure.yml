# ============================================
# setup-structure.yml — 四倉架構 + 動態共享包（v10a 雙軌版）
# 位置：AI-General/.github/workflows/setup-structure.yml
# ============================================
# v10a（B34-5 體系重構，雙軌並存）：
#   - 新增：STATE-INDEX 生成、P-01 YAML 掃描、廢除檔引用校驗
#   - 保留：R-01 / PROJECT-LIST 讀取與生成（供舊源檔）
#   - 停止：FILE-INDEX / HISTORY-INDEX 生成（由 STATE-INDEX 取代）
#   - 專案清單：yml 頂部 PROJECT_REPOS（新增專案時更新此處）
# ============================================

name: Build Shared Packages and Deploy

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/records/STATE-INDEX.md'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.gif'
      - '**/*.svg'
      - '**/*.ico'
  repository_dispatch:
    types: [web-app-family-updated]
  workflow_dispatch:

concurrency:
  group: setup-structure
  cancel-in-progress: false

# ============================================
# 專案 Repo 清單（新增專案時由使用者提供，AI 更新此處）
# 格式：name|path|repo|package_no|package|domain|display
# ============================================
env:
  PROJECT_REPOS: |
    web-app-family|external/web-app-family|tlee20860-dotcom/WEB-APP-Family|90|PACKAGE-web-app-family.md|W|家庭 webapp

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ============================================
      # 前置：Checkout
      # ============================================
      - name: Checkout AI-General
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout AI-packages
        uses: actions/checkout@v4
        with:
          repository: tlee20860-dotcom/AI-packages
          token: ${{ secrets.CROSS_REPO_PAT }}
          path: build-repo

      - name: Checkout project repos
        run: |
          echo "=== Checkout: project repos ==="

          if [ -n "$PROJECT_REPOS" ]; then
            echo "  來源：yml PROJECT_REPOS"
            echo "$PROJECT_REPOS" | sed 's/\r//g' | while IFS='|' read -r name path repo pkgno pkg domain display; do
              if [ -z "$repo" ]; then continue; fi
              echo "  Checkout: $repo -> $path"
              git clone --depth 1 "https://x-access-token:${{ secrets.CROSS_REPO_PAT }}@github.com/$repo.git" "$path" 2>/dev/null || echo "    (clone 失敗，跳過)"
            done
            exit 0
          fi

          if [ -f "docs/records/PROJECT-LIST.md" ]; then
            echo "  來源：PROJECT-LIST.md（fallback，v10b 將移除）"
            awk '
              /^## 專案/ { block=1; next }
              block && /^name:/ { name=$2 }
              block && /^repo:/ { repo=$2 }
              block && /^---/ {
                if (name && repo) print name "|external/" name "|" repo
                name=""; repo=""; block=0
              }
            ' docs/records/PROJECT-LIST.md > /tmp/repos.txt
            while IFS='|' read -r name path repo; do
              if [ -n "$repo" ]; then
                echo "  Checkout: $repo -> $path"
                git clone --depth 1 "https://x-access-token:${{ secrets.CROSS_REPO_PAT }}@github.com/$repo.git" "$path" 2>/dev/null || echo "    (clone 失敗，跳過)"
              fi
            done < /tmp/repos.txt
          else
            echo "  PROJECT_REPOS 與 PROJECT-LIST 皆無，跳過"
          fi

      # ============================================
      # Step 2a: 掃描各 P-01 YAML
      # ============================================
      - name: "Step 2a: 掃描各 P-01 YAML"
        run: |
          echo "=== Step 2a: 掃描各 P-01 YAML ==="
          > /tmp/p01-list.txt

          if [ -d "external" ]; then
            for p01 in external/*/docs/projects/*/P-01-index.md; do
              if [ ! -f "$p01" ]; then continue; fi

              name=$(awk '/^---$/{c++; next} c==1 && /^name:/{sub(/^name:[ ]*/, ""); print; exit}' "$p01")
              code=$(awk '/^---$/{c++; next} c==1 && /^code:/{sub(/^code:[ ]*/, ""); print; exit}' "$p01")
              domain=$(awk '/^---$/{c++; next} c==1 && /^domain:/{sub(/^domain:[ ]*/, ""); print; exit}' "$p01")
              pkgno=$(awk '/^---$/{c++; next} c==1 && /^package_no:/{sub(/^package_no:[ ]*/, ""); print; exit}' "$p01")
              repo=$(awk '/^---$/{c++; next} c==1 && /^repo:/{sub(/^repo:[ ]*/, ""); print; exit}' "$p01")
              display=$(awk '/^---$/{c++; next} c==1 && /^display:/{sub(/^display:[ ]*/, ""); print; exit}' "$p01")

              name=${name:-$(basename "$(dirname "$p01")")}
              display=${display:-$name}
              domain=${domain:--}
              pkgno=${pkgno:--}
              repo=${repo:--}
              code=${code:-$name}

              echo "$display|$code|$domain|$pkgno|$repo" >> /tmp/p01-list.txt
              echo "  找到專案：$display (code=$code, domain=$domain, pkgno=$pkgno)"
            done
          fi

          echo "=== Step 2a 完成，共 $(wc -l < /tmp/p01-list.txt) 個專案 ==="

      # ============================================
      # Step 2b: 生成 STATE-INDEX.md
      # ============================================
      - name: "Step 2b: 生成 STATE-INDEX.md"
        run: |
          echo "=== Step 2b: 生成 STATE-INDEX.md ==="
          OUTPUT="docs/records/STATE-INDEX.md"
          GEN_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')

          TMP_TABLE="/tmp/state-index-files.txt"
          > "$TMP_TABLE"

          scan_files() {
            local base="$1"
            local dir="$2"
            if [ ! -d "$dir" ]; then return 0; fi
            find "$dir" -type f \( -name "*.md" -o -name "*.yml" -o -name "*.js" -o -name "*.html" -o -name "*.css" \) \
              -not -path "*/.git/*" \
              -not -path "*/node_modules/*" \
              -not -path "*/build-repo/*" \
              | while read -r f; do
                tail -n 15 "$f" | sed 's/^[[:space:]]*\(#[/*!-]*\|<!--\)[[:space:]]*//;s/[[:space:]]*\*\/-->*[[:space:]]*$//' > /tmp/eof-tail.txt
                V=$(grep -oE '^V: *[0-9]+' /tmp/eof-tail.txt | head -1 | sed 's/^V: *//' || true)
                B=$(grep -oE '^B: *[^ ]+' /tmp/eof-tail.txt | head -1 | sed 's/^B: *//' || true)
                W=$(grep -oE '^W: *[^ ]+' /tmp/eof-tail.txt | head -1 | sed 's/^W: *//' || true)
                if [ -z "$V" ]; then continue; fi
                REL="${f#./}"
                REL="${REL#docs/}"
                echo "$base|$REL|$V|$B|$W" >> "$TMP_TABLE"
              done || true
          }

          scan_files "AI-General" "docs"
          scan_files "AI-General" ".github"
          if [ -d "external" ]; then
            for repo_dir in external/*/; do
              if [ ! -d "$repo_dir" ]; then continue; fi
              repo_name=$(basename "$repo_dir")
              scan_files "$repo_name" "$repo_dir"
            done
          fi

          if [ -f "docs/records/STATE-INDEX.md" ] && grep -q '^## 三、歷史歸屬' "docs/records/STATE-INDEX.md"; then
            HISTORY_ROWS=$(sed -n '/^## 三、歷史歸屬/,/^## 四/p' "docs/records/STATE-INDEX.md" | grep '^| ' | grep -v '^|---' || true)
          elif [ -f "docs/records/R-01-writers.md" ]; then
            HISTORY_ROWS=$(sed -n '/^## 六、歷史歸屬/,/^---$/p' "docs/records/R-01-writers.md" | grep '^| ' | grep -v '^|---' || true)
          else
            HISTORY_ROWS=""
          fi

          {
            echo "# STATE-INDEX（體系狀態索引）"
            echo ""
            echo "> ⚠️ 本檔由 GitHub Actions 自動生成（掃描各 P-01 YAML + 所有檔案 EOF），請勿手動編輯。"
            echo ""
            echo "最後更新：$GEN_TIME"
            echo ""
            echo "---"
            echo ""
            echo "## 一、專案總覽"
            echo ""
            echo "| 專案顯示名稱 | code | domain | package_no | repo |"
            echo "|---|---|---|---|---|"
            if [ -s "/tmp/p01-list.txt" ]; then
              while IFS='|' read -r display code domain pkgno repo; do
                if [ -z "$display" ]; then continue; fi
                echo "| $display | $code | $domain | $pkgno | $repo |"
              done < /tmp/p01-list.txt
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 二、檔案清單（依 Version 排序）"
            echo ""
            echo "| Repo | 檔案 | Version | Batch | Writer |"
            echo "|---|---|---|---|---|"
            if [ -s "$TMP_TABLE" ]; then
              sort -t'|' -k3 -nr "$TMP_TABLE" | while IFS='|' read -r repo file v b w; do
                if [ -z "$repo" ]; then continue; fi
                echo "| $repo | $file | $v | $b | $w |"
              done
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 三、歷史歸屬"
            echo ""
            if [ -n "$HISTORY_ROWS" ]; then
              echo "$HISTORY_ROWS"
            else
              echo "| 檔案 | 舊版本 | 舊 Writer | 新版本 | 新 Writer | 取代時間 |"
              echo "|---|---|---|---|---|---|"
            fi
            echo ""
            echo "---"
            echo ""
            echo "## 四、已廢除檔案"
            echo ""
            echo "| 檔案 | 廢除時間 | 內容去向 |"
            echo "|---|---|---|"
            echo "| R-01-writers.md | （v10b 執行） | 內容分散至 C-02、P-01 YAML、STATE-INDEX（D-148） |"
            echo "| PROJECT-LIST.md | （v10b 執行） | 內容分散至 C-00、P-01 YAML、STATE-INDEX（D-148） |"
            echo "| FILE-INDEX.md | 2026-10-17（v10a） | 由 STATE-INDEX 取代 |"
            echo "| HISTORY-INDEX.md | 2026-10-17（v10a） | 由 STATE-INDEX 取代 |"
            echo ""
            echo "/* ═══ EOF ═══"
            echo "F: AI-General/docs/records/STATE-INDEX.md"
            echo "V: $(date -u +%s)"
            echo "B: B34-5"
            echo "W: ai-system-20261017-004#019"
            echo "═══ */"
          } > "$OUTPUT"

          echo "  ✓ 已生成 STATE-INDEX.md（$(wc -l < "$OUTPUT") 行）"
          echo "=== Step 2b 完成 ==="

      # ============================================
      # Step 2c: 廢除檔引用校驗（只警告，不中斷）
      # ============================================
      - name: "Step 2c: 廢除檔引用校驗"
        run: |
          echo "=== Step 2c: 廢除檔引用校驗 ==="
          WARN_COUNT=0

          while IFS= read -r f; do
            if [ -z "$f" ]; then continue; fi
            if echo "$f" | grep -q "STATE-INDEX.md"; then continue; fi
            if echo "$f" | grep -q "build-repo"; then continue; fi
            if echo "$f" | grep -qE "(\.git|node_modules)"; then continue; fi

            for dep in "R-01-writers" "PROJECT-LIST" "FILE-INDEX" "HISTORY-INDEX"; do
              if grep -q "$dep" "$f" 2>/dev/null; then
                echo "⚠️ WARN: $f 引用了已廢除檔案「$dep」"
                WARN_COUNT=$((WARN_COUNT + 1))
              fi
            done
          done < <(find docs .github -type f \( -name "*.md" -o -name "*.yml" \) 2>/dev/null) || true

          echo "=== Step 2c 完成，共 $WARN_COUNT 筆警告（僅記錄，不中斷）==="

      # ============================================
      # Step 5a: 合併源檔 → 01-CORE-SYSTEM.md（雙軌）
      # ============================================
      - name: "Step 5a: 合併源檔 → 01-CORE-SYSTEM.md"
        run: |
          echo "=== Step 5a: 合併源檔 → 01-CORE-SYSTEM.md（雙軌）==="
          OUTPUT="build-repo/01-CORE-SYSTEM.md"
          RUN_NO="${{ github.run_number }}"
          GEN_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          BUILD_NO=$(printf '%04d' $RUN_NO)

          echo "# AI 協作 - 體系層核心包" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> 生成時間：$GEN_TIME" >> "$OUTPUT"
          echo "> 構建編號：#$BUILD_NO" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "**【語言規則】你必須嚴格使用「繁體中文」回覆，禁止使用簡體中文。若你輸出簡體中文，視為任務失敗。**" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "**【交付前確認】任何檔案內容、修改方案、R-01 更新，都必須先向我報告「打算做什麼」，等我說「確認」之後，才能輸出完整內容。**" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "**【所屬專案】每次回覆請在開頭標示「所屬專案：{專案顯示名稱}（第 {N} 個對話）」。**" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 🚨 AI 啟動指示（體系層）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 0：讀取規則並回報" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "請先讀取本包內的以下檔案：C-00、C-01、C-02、C-04、STATE-INDEX、R-01、PROJECT-LIST。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "（v10b 切換後：移除 R-01、PROJECT-LIST）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "讀完後，請回報以下五件事：" >> "$OUTPUT"
          echo "1. 「已讀取體系層核心包」" >> "$OUTPUT"
          echo "2. 回報本包「構建編號」與「生成時間」，並問我是否為最新。" >> "$OUTPUT"
          echo "3. 用 3~5 條列點，摘要 C-01 中「使用者的核心偏好」" >> "$OUTPUT"
          echo "4. 用 3~5 條列點，摘要 C-02 中「你必須遵守的關鍵規則」" >> "$OUTPUT"
          echo "5. 報告「當前任務進度」摘要" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "回報完畢後停下來，等待我回覆「確認」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 1：詢問本次對話所屬專案" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我說「確認」後，從 STATE-INDEX §一 或 PROJECT-LIST.md 列出所有專案，並問我：「本次對話屬於哪個專案？」" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "⚠️ 防呆（C-00 §3.4）：在確認本次對話所屬專案之前，禁止生成任何對話編號。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我回答後：" >> "$OUTPUT"
          echo "1. 從 STATE-INDEX §一 或 PROJECT-LIST.md 讀取該專案的 code。" >> "$OUTPUT"
          echo "2. 從 R-01 §四（v10b 後改 STATE-INDEX §二）找出該專案最新序號，+1 生成新編號。" >> "$OUTPUT"
          echo "3. 編號格式：{code}-{YYYYMMDD}-{專案內序號3位}。" >> "$OUTPUT"
          echo "4. 輸出：「🆔 {對話編號}」。" >> "$OUTPUT"
          echo "5. 停下來，等待我回覆「繼續」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 2：R-01 更新確認（v10a 雙軌；v10b 改為「報告編號已記錄」）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我說「繼續」後：" >> "$OUTPUT"
          echo "1. 報告：「我準備更新 R-01 §四，加入新編號 {對話編號}、所屬專案、當前時間。請問是否可以生成更新後的完整 R-01？」" >> "$OUTPUT"
          echo "2. 停下來，等待我回覆「確認」。" >> "$OUTPUT"
          echo "3. 收到確認後，才輸出完整的、更新後的 R-01-writers.md 內容。" >> "$OUTPUT"
          echo "4. 提示我：「請將以上內容複製，貼到 docs/records/R-01-writers.md，完成後回覆『已更新』」。" >> "$OUTPUT"
          echo "5. 停下來，等待我回覆「已更新」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 3：進入需求討論" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "（體系層對話，無需上傳專案包，直接說明需求即可）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 4：先收集後交付（核心規則）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "當我提出需求時：" >> "$OUTPUT"
          echo "1. 自動從本包中找出相關檔案，禁止詢問「要讀取哪些檔案」。" >> "$OUTPUT"
          echo "2. 先向我報告：「我分析了以下檔案：XXX。我建議的修改方案是：YYY。請問是否同意此方案？」" >> "$OUTPUT"
          echo "3. 收到「確認」後，**只記錄修改點到「檔案狀態總表」，不立即交付**。" >> "$OUTPUT"
          echo "4. 持續討論，直到我說「開始交付」，才整合所有修改點，列完整清單。" >> "$OUTPUT"
          echo "5. 等我說「確認清單」，才逐批交付。每個檔案只交付一次（見 C-02 §19）。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## ⛔ 禁止事項（違反視為任務失敗）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "1. 禁止使用簡體中文回覆。" >> "$OUTPUT"
          echo "2. 禁止在未經我確認前，直接輸出任何檔案內容或修改方案。" >> "$OUTPUT"
          echo "3. 禁止跳過步驟 0，直接進入步驟 1。" >> "$OUTPUT"
          echo "4. 禁止在步驟 1 之前，自行假設專案。" >> "$OUTPUT"
          echo "5. 禁止一次輸出超過 2000 字的方案，請分段並等待我確認。" >> "$OUTPUT"
          echo "6. 禁止未標示「所屬專案」。" >> "$OUTPUT"
          echo "7. 禁止以 Token 為理由，交付不完整的檔案。" >> "$OUTPUT"
          echo "8. 禁止在未說「開始交付」前，提前交付任何檔案。" >> "$OUTPUT"
          echo "9. 禁止同一個檔案重複交付。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 📚 核心訓練規則" >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          for f in \
            docs/common/C-00-startup.md \
            docs/common/C-01-profile.md \
            docs/common/C-02-rules.md \
            docs/common/C-03-guide.md \
            docs/common/C-04-delivery.md \
            docs/common/C-06-token-log.md \
            docs/common/C-07-summary.md \
            docs/common/C-09-rolling-mechanism.md \
            docs/common/C-10-handoff-mechanism.md \
            docs/common/C-11-terms.md \
            docs/records/R-01-writers.md \
            docs/records/STATE-INDEX.md
          do
            if [ -f "$f" ]; then
              bash .github/workflows/append_file.sh "$f" "$OUTPUT" || true
            fi
          done

          if [ -f "docs/common/C-05-learning/general.md" ]; then
            bash .github/workflows/append_file.sh "docs/common/C-05-learning/general.md" "$OUTPUT" || true
          fi
          if [ -f "docs/common/C-05-learning/system.md" ]; then
            bash .github/workflows/append_file.sh "docs/common/C-05-learning/system.md" "$OUTPUT" || true
          fi

          if [ -f "docs/records/SYSTEM-HANDOFF.md" ]; then
            echo "---" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            bash .github/workflows/append_file.sh "docs/records/SYSTEM-HANDOFF.md" "$OUTPUT" || true
          fi
          if [ -f "docs/records/SYSTEM-CONCLUSION.md" ]; then
            echo "---" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            bash .github/workflows/append_file.sh "docs/records/SYSTEM-CONCLUSION.md" "$OUTPUT" || true
          fi
          if [ -f "docs/records/PROGRESS.md" ]; then
            echo "---" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            bash .github/workflows/append_file.sh "docs/records/PROGRESS.md" "$OUTPUT" || true
          fi

          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 📋 專案清單（PROJECT-LIST.md，v10b 將移除）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          if [ -f "docs/records/PROJECT-LIST.md" ]; then
            bash .github/workflows/append_file.sh "docs/records/PROJECT-LIST.md" "$OUTPUT" || true
          fi

          echo "=== Step 5a 完成 ==="

      # ============================================
      # Step 5b: 合併源檔 → 02-CORE-PROJECT.md（雙軌）
      # ============================================
      - name: "Step 5b: 合併源檔 → 02-CORE-PROJECT.md"
        run: |
          echo "=== Step 5b: 合併源檔 → 02-CORE-PROJECT.md（雙軌）==="
          OUTPUT="build-repo/02-CORE-PROJECT.md"
          RUN_NO="${{ github.run_number }}"
          GEN_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          BUILD_NO=$(printf '%04d' $RUN_NO)

          echo "# AI 協作 - 專案層核心包" > "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "> 生成時間：$GEN_TIME" >> "$OUTPUT"
          echo "> 構建編號：#$BUILD_NO" >> "$OUTPUT"
          echo "> 使用方式：搭配專案包（如 90-web-app-family.md）一起上傳。" >> "$OUTPUT"
          echo "> 專案包已內含該領域技能包，本包不需再單獨傳技能包。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "**【語言規則】你必須嚴格使用「繁體中文」回覆，禁止使用簡體中文。若你輸出簡體中文，視為任務失敗。**" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "**【交付前確認】任何檔案內容、修改方案，都必須先向我報告「打算做什麼」，等我說「確認」之後，才能輸出完整內容。**" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "**【所屬專案】每次回覆請在開頭標示「所屬專案：{專案顯示名稱}（第 {N} 個對話）」。**" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 🚨 AI 啟動指示（專案層）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 0：讀取規則並回報" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "請先讀取本包內的以下檔案：C-00、C-01、C-04、STATE-INDEX、R-01、PROJECT-LIST。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "（v10b 切換後：移除 R-01、PROJECT-LIST）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "讀完後，請回報以下四件事：" >> "$OUTPUT"
          echo "1. 「已讀取專案層核心包」" >> "$OUTPUT"
          echo "2. 回報本包「構建編號」與「生成時間」，並問我是否為最新。" >> "$OUTPUT"
          echo "3. 用 3~5 條列點，摘要 C-01 中「使用者的核心偏好」" >> "$OUTPUT"
          echo "4. 提示我上傳對應的專案包（如 90-web-app-family.md）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "回報完畢後停下來，等待我回覆「確認」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 1：詢問本次對話所屬專案" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我說「確認」後，從 STATE-INDEX §一 或 PROJECT-LIST.md 列出所有專案，並問我：「本次對話屬於哪個專案？」" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "⚠️ 防呆（C-00 §3.4）：在確認本次對話所屬專案之前，禁止生成任何對話編號。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我回答後：" >> "$OUTPUT"
          echo "1. 從 STATE-INDEX §一 或 PROJECT-LIST.md 讀取該專案的 code。" >> "$OUTPUT"
          echo "2. 從 R-01 §四（v10b 後改 STATE-INDEX §二）找出該專案最新序號，+1 生成新編號。" >> "$OUTPUT"
          echo "3. 編號格式：{code}-{YYYYMMDD}-{專案內序號3位}。" >> "$OUTPUT"
          echo "4. 輸出：「🆔 {對話編號}」。" >> "$OUTPUT"
          echo "5. 停下來，等待我回覆「繼續」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 2：R-01 更新確認（v10a 雙軌；v10b 改為「報告編號已記錄」）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我說「繼續」後：" >> "$OUTPUT"
          echo "1. 報告：「我準備更新 R-01 §四，加入新編號 {對話編號}、所屬專案、當前時間。請問是否可以生成更新後的完整 R-01？」" >> "$OUTPUT"
          echo "2. 停下來，等待我回覆「確認」。" >> "$OUTPUT"
          echo "3. 收到確認後，才輸出完整的、更新後的 R-01-writers.md 內容。" >> "$OUTPUT"
          echo "4. 提示我：「請將以上內容複製，貼到 docs/records/R-01-writers.md，完成後回覆『已更新』」。" >> "$OUTPUT"
          echo "5. 停下來，等待我回覆「已更新」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 3：請求對應的專案包" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "等我說「已更新」後，若尚未上傳專案包，說「請上傳對應編號的專案包（如 90-web-app-family.md）以繼續」。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "### 🔹 步驟 4：先收集後交付（核心規則）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "收到專案包後，當我提出需求時：" >> "$OUTPUT"
          echo "1. 自動從共享包中找出相關檔案，禁止詢問「要讀取哪些檔案」。" >> "$OUTPUT"
          echo "2. 先向我報告：「我分析了以下檔案：XXX。我建議的修改方案是：YYY。請問是否同意此方案？」" >> "$OUTPUT"
          echo "3. 收到「確認」後，**只記錄修改點到「檔案狀態總表」，不立即交付**。" >> "$OUTPUT"
          echo "4. 持續討論，直到我說「開始交付」，才整合所有修改點，列完整清單。" >> "$OUTPUT"
          echo "5. 等我說「確認清單」，才逐批交付。每個檔案只交付一次（見 C-02 §19）。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## ⛔ 禁止事項（違反視為任務失敗）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "1. 禁止使用簡體中文回覆。" >> "$OUTPUT"
          echo "2. 禁止在未經我確認前，直接輸出任何檔案內容或修改方案。" >> "$OUTPUT"
          echo "3. 禁止跳過步驟 0，直接進入步驟 1。" >> "$OUTPUT"
          echo "4. 禁止在步驟 1 之前，自行假設專案。" >> "$OUTPUT"
          echo "5. 禁止一次輸出超過 2000 字的方案，請分段並等待我確認。" >> "$OUTPUT"
          echo "6. 禁止未標示「所屬專案」。" >> "$OUTPUT"
          echo "7. 禁止以 Token 為理由，交付不完整的檔案。" >> "$OUTPUT"
          echo "8. 禁止在未說「開始交付」前，提前交付任何檔案。" >> "$OUTPUT"
          echo "9. 禁止同一個檔案重複交付。" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 📚 核心訓練規則" >> "$OUTPUT"
          echo "" >> "$OUTPUT"

          for f in \
            docs/common/C-00-startup.md \
            docs/common/C-01-profile.md \
            docs/common/C-04-delivery.md \
            docs/common/C-11-terms.md \
            docs/records/R-01-writers.md \
            docs/records/STATE-INDEX.md
          do
            if [ -f "$f" ]; then
              bash .github/workflows/append_file.sh "$f" "$OUTPUT" || true
            fi
          done

          if [ -f "docs/common/C-05-learning/general.md" ]; then
            bash .github/workflows/append_file.sh "docs/common/C-05-learning/general.md" "$OUTPUT" || true
          fi
          if [ -f "docs/common/C-05-learning/w.md" ]; then
            bash .github/workflows/append_file.sh "docs/common/C-05-learning/w.md" "$OUTPUT" || true
          fi

          echo "---" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          echo "## 📋 專案清單（PROJECT-LIST.md，v10b 將移除）" >> "$OUTPUT"
          echo "" >> "$OUTPUT"
          if [ -f "docs/records/PROJECT-LIST.md" ]; then
            bash .github/workflows/append_file.sh "docs/records/PROJECT-LIST.md" "$OUTPUT" || true
          fi

          echo "=== Step 5b 完成 ==="

      # ============================================
      # Step 5c: 生成技能包（10 / 20 / 30...）
      # ============================================
      - name: "Step 5c: 生成技能包"
        run: |
          echo "=== Step 5c: 生成技能包 ==="
          RUN_NO="${{ github.run_number }}"
          BUILD_NO=$(printf '%04d' $RUN_NO)

          build_skill() {
            local prefix="$1"
            local outfile="$2"
            local skilldir="docs/skills/${prefix}"
            if [ ! -d "$skilldir" ]; then
              return 0
            fi
            OUTPUT="build-repo/${outfile}"
            echo "# ${prefix} 技能包" > "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "> 生成時間：$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$OUTPUT"
            echo "> 構建編號：#$BUILD_NO" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            for f in ${skilldir}/*.md; do
              if [ -f "$f" ]; then
                bash .github/workflows/append_file.sh "$f" "$OUTPUT" || true
              fi
            done
          }

          build_skill "W" "10-SKILLS-W.md"
          build_skill "V" "20-SKILLS-V.md"
          build_skill "D" "30-SKILLS-D.md"

          echo "=== Step 5c 完成 ==="

      # ============================================
      # Step 5d: 動態生成所有專案包（含領域技能包）
      # ============================================
      - name: "Step 5d: 動態生成所有專案包"
        run: |
          echo "=== Step 5d: 動態生成所有專案包 ==="

          RUN_NO="${{ github.run_number }}"
          BUILD_NO=$(printf '%04d' $RUN_NO)

          # 統一來源：優先用 PROJECT_REPOS；fallback 讀 PROJECT-LIST
          > /tmp/projects.txt
          if [ -n "$PROJECT_REPOS" ]; then
            echo "  來源：yml PROJECT_REPOS"
            echo "$PROJECT_REPOS" | sed 's/\r//g' >> /tmp/projects.txt
          elif [ -f "docs/records/PROJECT-LIST.md" ]; then
            echo "  來源：PROJECT-LIST.md（fallback）"
            awk '
              /^## 專案/ { block=1; next }
              block && /^name:/ { name=$2 }
              block && /^package_no:/ { pkgno=$2 }
              block && /^package:/ { pkg=$2 }
              block && /^domain:/ { domain=$2 }
              block && /^display:/ { display=$2 }
              block && /^---/ {
                if (name && pkgno && pkg && pkg != "（無，體系層不生成專案包）") print name "|external/" name "|" pkgno "|" pkg "|" domain "|" display
                name=""; pkgno=""; pkg=""; domain=""; display=""; block=0
              }
            ' docs/records/PROJECT-LIST.md > /tmp/projects.txt
          else
            echo "  無專案來源，跳過"
            echo "=== Step 5d 完成（0 個專案）==="
            exit 0
          fi

          while IFS='|' read -r name path pkgno pkg domain display; do
            if [ -z "$name" ]; then continue; fi
            if [ -z "$pkg" ]; then continue; fi
            if [ "$pkg" = "（無，體系層不生成專案包）" ]; then continue; fi

            SHORT="${pkg#PACKAGE-}"
            OUTPUT="build-repo/${pkgno}-${SHORT}"

            echo "# 專案包：${name}" > "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "> 生成時間：$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> "$OUTPUT"
            echo "> 構建編號：#$BUILD_NO" >> "$OUTPUT"
            echo "> 領域：${domain}" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "## 📌 使用方式" >> "$OUTPUT"
            echo "" >> "$OUTPUT"
            echo "本檔案為「${display:-$name}」專案的完整上下文包（含專案文件、程式碼、領域技能包）。" >> "$OUTPUT"
            echo "請搭配 02-CORE-PROJECT.md 一起上傳。" >> "$OUTPUT"
            echo "" >> "$OUTPUT"

            proj_docs_dir="$path/docs/projects/${name}"
            if [ -d "$proj_docs_dir" ]; then
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "# 📁 專案文件" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              for f in ${proj_docs_dir}/*.md; do
                if [ -f "$f" ]; then
                  bash .github/workflows/append_file.sh "$f" "$OUTPUT" || true
                fi
              done
            fi

            if [ -d "$path" ]; then
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "# 💻 專案程式碼" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              (
                cd "$path" || exit 0
                find . -type f \( -name "*.js" -o -name "*.html" -o -name "*.css" -o -name "*.json" \) \
                  -not -path "./.git/*" \
                  -not -path "./node_modules/*" \
                  -not -path "./.github/*" \
                  -not -path "./docs/*" \
                  | sort > /tmp/code_files.txt || true
                if [ -s /tmp/code_files.txt ]; then
                  while read -r file; do
                    bash "../../.github/workflows/append_file.sh" "$file" "../../$OUTPUT" || true
                  done < /tmp/code_files.txt
                fi
              ) || true
            fi

            case "$domain" in
              W) SKILL_FILE="build-repo/10-SKILLS-W.md" ;;
              V) SKILL_FILE="build-repo/20-SKILLS-V.md" ;;
              D) SKILL_FILE="build-repo/30-SKILLS-D.md" ;;
              *) SKILL_FILE="" ;;
            esac
            if [ -n "$SKILL_FILE" ] && [ -f "$SKILL_FILE" ]; then
              echo "---" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              echo "# 📚 領域技能包（${domain}）" >> "$OUTPUT"
              echo "" >> "$OUTPUT"
              cat "$SKILL_FILE" >> "$OUTPUT" || true
            fi

            echo "" >> "$OUTPUT"
            echo "/* ═══ EOF ═══ */" >> "$OUTPUT"
            echo "  ✓ 已生成 ${OUTPUT}"
          done < /tmp/projects.txt || true

          echo "=== Step 5d 完成 ==="

      # ============================================
      # Step 6: 上傳共享包（含 STATE-INDEX commit 到 AI-General）
      # ============================================
      - name: "Step 6: 上傳共享包"
        run: |
          echo "=== Step 6: 上傳共享包 ==="

          # Commit STATE-INDEX 到 AI-General
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/records/STATE-INDEX.md
          if git diff --cached --quiet; then
            echo "  (AI-General 無變更，略過 commit)"
          else
            git commit -m "chore: auto-update STATE-INDEX [skip ci]"
            git push || echo "  push 失敗（可能為權限或無變化）"
          fi

          # Deploy to AI-packages
          cd build-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "  (AI-packages 無變更，略過 push)"
            exit 0
          fi
          git commit -m "chore: auto-build packages [skip ci]"
          git push

          echo "=== Step 6 完成 ==="

