# ============================================
# setup-migration.yml — 一次性遷移（可重複使用）
# 位置：AI-General/.github/workflows/setup-migration.yml
# ============================================

name: Setup Migration

on:
  workflow_dispatch:
    inputs:
      phase:
        description: '執行階段（phase-1：複製；phase-2：刪除源頭）'
        required: true
        default: 'phase-1'
        type: choice
        options:
          - phase-1
          - phase-2

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone AI-General
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          mkdir -p /tmp/repos
          cd /tmp/repos
          git clone "https://x-access-token:${GH_TOKEN}@github.com/tlee20860-dotcom/AI-General.git" AI-General 2>/dev/null || echo "clone AI-General 失敗"

      - name: Read participating repos
        run: |
          awk '
            /^## 參與倉庫/ { block=1; next }
            block && /^---/ { block=0 }
            block && /^- / { print $2 }
          ' /tmp/repos/AI-General/MIGRATION.md > /tmp/repos_list.txt
          echo "參與倉庫："
          cat /tmp/repos_list.txt

      - name: Clone all other repos
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_PAT }}
        run: |
          cd /tmp/repos
          while read -r repo; do
            [ -z "$repo" ] && continue
            name=$(basename "$repo")
            if [ -d "$name" ]; then continue; fi
            git clone "https://x-access-token:${GH_TOKEN}@github.com/$repo.git" "$name" 2>/dev/null || echo "  clone $repo 失敗"
          done < /tmp/repos_list.txt

      - name: Parse MIGRATION.md
        run: |
          awk '
            /^## 任務/ { block=1; next }
            block && /^source_repo:/ { sr=$2 }
            block && /^source_path:/ { sp=$2 }
            block && /^target_repo:/ { tr=$2 }
            block && /^target_path:/ { tp=$2 }
            block && /^---/ {
              if (sr && sp && tr && tp) print sr "|" sp "|" tr "|" tp
              sr=""; sp=""; tr=""; tp=""; block=0
            }
          ' /tmp/repos/AI-General/MIGRATION.md > /tmp/tasks.txt
          echo "解析到 $(wc -l < /tmp/tasks.txt) 個任務"
          cat /tmp/tasks.txt

      - name: Execute migration
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          shopt -s nullglob
          while IFS='|' read -r sr sp tr tp; do
            [ -z "$sr" ] && continue
            source_name=$(basename "$sr")
            target_name=$(basename "$tr")
            source_dir="/tmp/repos/$source_name"
            target_dir="/tmp/repos/$target_name"

            if [ ! -d "$source_dir" ]; then
              echo "源倉庫不存在：$source_dir"
              continue
            fi
            if [ ! -d "$target_dir" ]; then
              echo "目標倉庫不存在：$target_dir"
              continue
            fi

            cd "$source_dir"
            mkdir -p "$target_dir/$tp"

            for f in $sp; do
              if [ -f "$f" ]; then
                filename=$(basename "$f")
                if [ "$PHASE" = "phase-1" ]; then
                  cp "$f" "$target_dir/$tp$filename"
                  echo "[phase-1] 複製 $f -> $target_name/$tp$filename"
                elif [ "$PHASE" = "phase-2" ]; then
                  rm -f "$f"
                  echo "[phase-2] 刪除源頭 $f"
                fi
              fi
            done
          done < /tmp/tasks.txt

      - name: Commit and push all repos
        env:
          PHASE: ${{ inputs.phase }}
        run: |
          cd /tmp/repos
          for repo_dir in */; do
            repo_name="${repo_dir%/}"
            cd "/tmp/repos/$repo_name"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            if git diff --cached --quiet; then
              echo "無變化：$repo_name"
            else
              if [ "$PHASE" = "phase-1" ]; then
                git commit -m "chore: migration phase-1 (copy) [skip ci]"
              else
                git commit -m "chore: migration phase-2 (delete source) [skip ci]"
              fi
              git push 2>&1 || echo "push 失敗：$repo_name"
              echo "已推送：$repo_name"
            fi
            cd /tmp/repos
          done

      - name: Summary
        run: |
          echo "═══════════════════════════════════════"
          echo "遷移完成"
          echo "階段：${{ inputs.phase }}"
          echo "═══════════════════════════════════════"
          echo "下一步："
          if [ "${{ inputs.phase }}" = "phase-1" ]; then
            echo "請確認目標倉庫的檔案是否正確。"
            echo "確認無誤後，重新執行本 Action，選擇 phase-2 刪除源頭。"
          else
            echo "遷移完成，源頭檔案已刪除。"
          fi
          echo "═══════════════════════════════════════"

