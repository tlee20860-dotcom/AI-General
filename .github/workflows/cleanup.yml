name: Cleanup Old Files

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Old Files
        run: |
          git rm -f docs/common/C-01-profile.md || true
          git rm -f docs/common/C-06-token-log.md || true
          git rm -f docs/common/C-07-summary.md || true
          git rm -f docs/common/C-09-rolling-mechanism.md || true
          git rm -f docs/common/C-10-handoff-mechanism.md || true
          git rm -f docs/common/C-11-terms.md || true

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: cleanup old C-files [skip ci]" || echo "No changes"
          git push || echo "Push failed"