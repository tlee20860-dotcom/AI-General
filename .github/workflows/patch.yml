name: Execute Patch Multi

on:
  push:
    paths:
      - '.github/workflows/PATCH.md'
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Patch
        run: |
          python3 -c "
import re
with open('.github/workflows/PATCH.md') as f:
    text = f.read()
blocks = re.findall(r'## 修改目標\s*\n?\`(.*?)\`.*?<<<<<<< OLD\n(.*?)=======\n(.*?)>>>>>>> NEW', text, re.DOTALL)
for t, o, n in blocks:
    t = t.strip()
    try:
        with open(t, 'r') as f: c = f.read()
        if c.count(o) == 1:
            with open(t, 'w') as f: f.write(c.replace(o, n))
            print(f'Success: {t}')
        else:
            print(f'Error or multiple matches: {t}')
    except Exception as e:
        print(f'Failed {t}: {e}')
          "
          rm -f .github/workflows/PATCH.md
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: multi-patch [skip ci]" || echo "No changes"
          git push